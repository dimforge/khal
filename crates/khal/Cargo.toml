[package]
name = "khal"
authors = ["Sébastien Crozet <sebcrozet@dimforge.com>"]
description = "Abstractions for running compute shaders with Rust."
repository = "https://github.com/dimforge/khal"
version = { workspace = true }
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = ["webgpu"]
derive = ["khal-derive"]
webgpu = ["khal-derive?/webgpu"]
cpu = ["khal-derive?/cpu"]
cuda = ["dep:cudarc", "khal-derive?/cuda"]
metal = ["dep:metal", "dep:naga", "dep:block", "khal-derive?/webgpu"]
push_constants = []
subgroup_ops = []

[dependencies]
wgpu = { workspace = true, features = ["wgsl"] }
bytemuck = { workspace = true }
anyhow = { workspace = true }
async-channel = { workspace = true }
thiserror = { workspace = true }
smallvec = "1"
include_dir = "0.7"

khal-derive = { version = "0.3", path = "../khal-derive", optional = true }
cudarc = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "nvptx64"))'.dependencies]
# cudarc is only available on host targets, not on nvptx64 device code.
regex = "1"
bitflags = "2"

# For test_shader_compilation
paste = "1"

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33", optional = true }
naga = { version = "30", optional = true, features = ["spv-in", "msl-out"] }
# Objective-C block support for Metal command-buffer completion handlers
# (non-blocking readback completion). Matches metal-rs's own `block` dep.
block = { version = "0.1.6", optional = true }

[lints.rust]
# The `objc` crate's `msg_send!` macro (used by the Metal backend) expands to
# a `cfg(feature = "cargo-clippy")` check, which trips `unexpected_cfgs` under
# clippy. Declare it as an expected cfg so it doesn't warn.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }