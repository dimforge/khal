[package]
name = "khal-example"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["webgpu"]
webgpu = [ "khal/webgpu" ]
metal = [ "khal/metal" ]
cpu = ["khal/cpu", "khal-example-shaders/cpu"]
cpu-parallel = ["cpu", "khal-example-shaders/cpu-parallel"]
cuda = ["khal/cuda", "khal-builder/cuda", "khal-example-shaders/cuda"]
# Native CUDA with kernels compiled by cuda-oxide (`cargo oxide`) rather than
# rust-cuda's `cargo cuda`. Implies `cuda`. Deliberately does NOT forward to
# the shader crate's `cuda-oxide` feature: khal-builder enables that one in its
# separate `cargo oxide` build only. In the host build it would swap khal-std's
# `Float`/atomics for GPU-only libdevice externs, which the CPU backend (`cpu`)
# cannot link.
cuda-oxide = ["cuda", "khal-builder/cuda-oxide"]

[dependencies]
khal = { version = "0.4.0", path = "../khal", features = ["derive"] }
include_dir = "0.7"
async-std = { version = "1", features = ["attributes"] }
khal-example-shaders = { path = "../khal-example-shaders" }

[build-dependencies]
khal-builder = { version = "0.4.0", path = "../khal-builder" }
# Listed as a build-dep (in addition to the regular `[dependencies]` entry
# above) so cargo runs the shader crate's `build.rs` before ours and
# forwards its `DEP_KHAL_EXAMPLE_SHADERS_MANIFEST_DIR` env var to our
# `build.rs`. Without this line our `build.rs` would have no way to locate
# the shader sources when this crate is consumed from crates.io.
khal-example-shaders = { path = "../khal-example-shaders" }